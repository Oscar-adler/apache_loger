database:
  host: localhost
  port: 5432
  name: logagg
  user: logagg
  password: logagg_pass

logs:
  # Директория с логами Apache
  directory: /var/log/apache2
  # Маска (glob) файлов
  mask: "*.log"
  # Кодировка
  encoding: utf-8
  # Формат: combined | common  (влияет на регексп)
  format: combined

server:
  host: 0.0.0.0
  port: 5000
  secret_key: "change-me-please-to-random-string"
  debug: false

scheduler:
  enabled: true
  interval_minutes: 5

import:
  batch_size: 1000       # вставка пачками
  max_entries_per_file: 1000000
