<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Log Aggregator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style> pre.log-line{white-space:pre-wrap;word-break:break-all;font-size:.8rem} </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('views.dashboard') }}">LogAgg</a>
    {% if current_user.is_authenticated %}
    <div class="ms-auto text-white">
      {{ current_user.username }} &nbsp;
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.logout') }}">Выйти</a>
    </div>
    {% endif %}
  </div>
</nav>
<div class="container-fluid pb-5">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}
      <div class="alert alert-{{ cat }}">{{ m }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
